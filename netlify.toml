# Netlify: build bằng Vite, xuất ra dist/, máy chủ nhỏ (Netlify Functions) trong netlify/functions/.
# Khóa 34AI mặc định: biến môi trường AI34_API_KEY (Site configuration → Environment variables),
# hoặc chạy scripts/dat-khoa-netlify.mjs (trien-khai-netlify.cmd tự hỏi lần đầu).
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# Trình duyệt luôn hỏi lại bản mới của trang và service worker (tệp trong /static có tên băm, giữ lâu được).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
